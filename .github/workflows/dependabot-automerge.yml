name: Dependabot Auto-merge

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Merge Dependabot PRs older than 3 days
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // No age gate here. Dependabot has applied a 3-day default cooldown
            // to version updates since 2026-07-14, so a PR does not exist until
            // the release has already aged — an extra wait in this job just
            // double-counts it (it used to make the real delay 6 days).
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });

            for (const pr of prs) {
              if (pr.user.login !== 'dependabot[bot]') continue;

              core.info(`Merging PR #${pr.number}: ${pr.title}`);
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                merge_method: 'squash',
              });
            }
