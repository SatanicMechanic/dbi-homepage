name: Dependabot Auto-merge

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Merge Dependabot PRs older than 3 days
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const THREE_DAYS_MS = 3 * 24 * 60 * 60 * 1000;
            const now = Date.now();

            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
            });

            for (const pr of prs) {
              if (pr.user.login !== 'dependabot[bot]') continue;

              const ageMs = now - new Date(pr.created_at).getTime();
              const ageDays = Math.floor(ageMs / 86400000);

              if (ageMs < THREE_DAYS_MS) {
                core.info(`PR #${pr.number} is ${ageDays}d old — cooldown not elapsed, skipping`);
                continue;
              }

              core.info(`Merging PR #${pr.number} (${ageDays}d old): ${pr.title}`);
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                merge_method: 'squash',
              });
            }
