<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NO CARRIER</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0c0a">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  :root { --bg: #0d0c0a; --fg: #e6dfcc; --key: #f0cc4a; color-scheme: dark; }
  html { background: var(--bg); -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; color: var(--fg);
    font: 16px/1.35 ui-monospace, Menlo, Consolas, monospace;
    padding: 32px 16px;
  }
  pre { margin: 0 auto; font: inherit; width: 40ch; max-width: 100%; }
  .key { color: var(--key); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  a { color: inherit; text-decoration: none; }
  a:hover .t, a:focus-visible .t { text-decoration: underline; text-underline-offset: 3px; }
  a:focus-visible { outline: 2px solid var(--key); outline-offset: 2px; }
</style>
</head>
<body>
<main>
<h1 class="sr">Page not found</h1>
<pre>NO CARRIER

<a href="/"> <span class="key">&lt;R&gt;</span> <span class="t">Redial</span></a></pre>
</main>
</body>
</html>
